packages:
- type: github_release
  repo_owner: felixgwilliams
  repo_name: nbwipers
  description: Strip outputs from Jupyter notebooks (Rust)
  asset: 'nbwipers-{{.Arch}}-unknown-linux-gnu.tar.gz'
  format: tar.gz
  files:
  - name: nbwipers
    src: nbwipers
  replacements:
    amd64: x86_64
    arm64: aarch64
  overrides:
  - goos: darwin
    asset: 'nbwipers-{{.Arch}}-apple-darwin.tar.gz'
  - goos: windows
    format: zip
    asset: 'nbwipers-{{.Arch}}-pc-windows-msvc.zip'
    files:
    - name: nbwipers
      src: nbwipers.exe
